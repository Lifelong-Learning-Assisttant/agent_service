version: "3.8"

services:
  agent_dev:
    container_name: agent-service-dev
    build:
      context: .
      dockerfile: Dockerfile-dev
    ports:
      - "8270:8270"
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.pytest_cache
    environment:
      - PYTHONUNBUFFERED=1
      - RAG_SERVICE_URL=http://rag-api:8000
      - TEST_GENERATOR_SERVICE_URL=http://test-generator-api:8000
      - WEB_UI_URL=http://web-backend:8151
    command: uv run python app.py --settings app_settings-dev.json
    networks:
      web_ui_network:
        aliases:
          - agent-service
      rag_rag_network:
        aliases:
          - agent-service
      test_generator_default:
        aliases:
          - agent-service

networks:
  web_ui_network:
    name: web_ui_network
    external: true
  rag_rag_network:
    name: rag_rag_network
    external: true
  test_generator_default:
    name: test_generator_default
    external: true